name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the builder image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: docker/builder
          load: true
          tags: samplez-builder:ci
          cache-from: type=gha,scope=builder
          cache-to: type=gha,scope=builder,mode=max
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            target
            .cargo-registry
          key: cargo-${{ hashFiles('Cargo.lock', 'docker/builder/Dockerfile') }}-${{ github.sha }}
          restore-keys: |
            cargo-${{ hashFiles('Cargo.lock', 'docker/builder/Dockerfile') }}-
            cargo-
      - name: Format, lint and test in the builder image
        run: |
          mkdir -p .cargo-registry
          docker run --rm --user "$(id -u):$(id -g)" \
            -v "$PWD:/w" -v "$PWD/.cargo-registry:/usr/local/cargo/registry" \
            -w /w samplez-builder:ci bash -euo pipefail -c '
              cargo fmt --all --check
              cargo clippy --workspace --all-targets --locked -- -D warnings
              cargo test --workspace --locked
            '
