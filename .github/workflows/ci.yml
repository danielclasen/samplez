name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: Build the builder image
        uses: docker/build-push-action@v6
        with:
          context: docker/builder
          load: true
          tags: samplez-builder:ci
          cache-from: type=gha,scope=builder
          cache-to: type=gha,scope=builder,mode=max
      - name: Format, lint and test in the builder image
        run: |
          docker run --rm -v "$PWD:/w" -w /w samplez-builder:ci bash -euo pipefail -c '
            cargo fmt --all --check
            cargo clippy --workspace --all-targets --locked -- -D warnings
            cargo test --workspace --locked
          '
