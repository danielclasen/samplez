name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Each job runs on its own runner with its own target directory and its
# own cargo cache. The caches hold dependencies only: the workspace's
# own crates are rebuilt on every checkout anyway (their sources are
# newer than any cached output), so they are cleaned out before a save.
# Caches are saved from main only, so per-PR snapshots do not evict the
# builder image layers from the shared Actions cache.

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # The one job that writes the builder layers back; the others read
      # them.
      - name: Build the builder image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: docker/builder
          load: true
          tags: samplez-builder:ci
          cache-from: type=gha,scope=builder
          cache-to: type=gha,scope=builder,mode=max
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            target
            .cargo-registry
          key: cargo-lint-${{ hashFiles('Cargo.lock', 'docker/builder/Dockerfile') }}-${{ github.sha }}
          restore-keys: |
            cargo-lint-${{ hashFiles('Cargo.lock', 'docker/builder/Dockerfile') }}-
            cargo-lint-
      - name: Format and lint in the builder image
        run: |
          mkdir -p .cargo-registry
          docker run --rm --user "$(id -u):$(id -g)" \
            -e SAMPLEZ_REQUIRE_PATHS=avx2 -e CARGO_INCREMENTAL=0 \
            -v "$PWD:/w" -v "$PWD/.cargo-registry:/usr/local/cargo/registry" \
            -w /w samplez-builder:ci bash -euo pipefail -c '
              cargo fmt --all --check
              cargo clippy --workspace --all-targets --locked -- -D warnings
              # The lint probe: a lock and a sleep in each RT crate must fail
              # clippy (clippy.toml).
              for probe in samplez:src/rt_loop.rs \
                samplez-mxl:crates/samplez-mxl/src/output.rs \
                samplez-dsp:crates/samplez-dsp/src/lib.rs; do
                if cargo clippy -p "${probe%%:*}" --lib --locked -- -D warnings \
                  --cfg "samplez_lint_probe=\"${probe%%:*}\"" 2> lint-probe.log; then
                  echo "the lint probe in ${probe#*:} passed clippy" >&2
                  exit 1
                fi
                for what in "disallowed type" "disallowed method .std::thread::sleep" \
                  "disallowed method .std::sync::Mutex::lock"; do
                  grep -A1 "$what" lint-probe.log | grep -q -- "--> ${probe#*:}" \
                    || { cat lint-probe.log >&2; echo "no $what in ${probe#*:}" >&2; exit 1; }
                done
              done
            '
      # A crates.io release Cargo.lock gains has to be 14 days old, unless
      # .github/lockfile-age/allow.txt lists it. The base is the PR's base
      # branch, or main before the push.
      - name: Lockfile release ages
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          python3 -B .github/lockfile-age/test_check.py
          git fetch -q --depth 1 origin "$BASE"
          git show "$BASE:Cargo.lock" > "$RUNNER_TEMP/base.lock"
          python3 -B .github/lockfile-age/check.py "$RUNNER_TEMP/base.lock" Cargo.lock \
            .github/lockfile-age/allow.txt
      # deny.toml: the licences every dependency, dev-dependencies
      # included, may carry.
      - name: Dependency licences
        env:
          DENY: https://github.com/EmbarkStudios/cargo-deny/releases/download/0.20.2/cargo-deny-0.20.2-x86_64-unknown-linux-musl.tar.gz
        run: |
          mkdir -p "$RUNNER_TEMP/deny"
          curl -sSfL -o "$RUNNER_TEMP/deny.tgz" "$DENY"
          echo "9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f  $RUNNER_TEMP/deny.tgz" \
            | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/deny.tgz" -C "$RUNNER_TEMP/deny" --strip-components=1
          docker run --rm --user "$(id -u):$(id -g)" \
            -v "$PWD:/w" -v "$PWD/.cargo-registry:/usr/local/cargo/registry" \
            -v "$RUNNER_TEMP/deny/cargo-deny:/usr/local/bin/cargo-deny:ro" \
            -w /w samplez-builder:ci \
            cargo-deny --locked --workspace --all-features check licenses
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        name: Clean the workspace crates out of the cache
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -e CARGO_INCREMENTAL=0 \
            -v "$PWD:/w" -v "$PWD/.cargo-registry:/usr/local/cargo/registry" \
            -w /w samplez-builder:ci cargo clean --locked \
            -p samplez -p samplez-dsp -p samplez-mxl -p samplez-nmos -p samplez-replica -p samplez-service
          du -sh target .cargo-registry
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            target
            .cargo-registry
          key: cargo-lint-${{ hashFiles('Cargo.lock', 'docker/builder/Dockerfile') }}-${{ github.sha }}

  # The debug tests, then the end-to-end scenarios over the debug build
  # on the same runner, as before.
  debug:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the builder image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: docker/builder
          load: true
          tags: samplez-builder:ci
          cache-from: type=gha,scope=builder
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            target
            .cargo-registry
          key: cargo-debug-${{ hashFiles('Cargo.lock', 'docker/builder/Dockerfile') }}-${{ github.sha }}
          restore-keys: |
            cargo-debug-${{ hashFiles('Cargo.lock', 'docker/builder/Dockerfile') }}-
            cargo-debug-
      - name: Test in the builder image
        run: |
          mkdir -p .cargo-registry
          docker run --rm --user "$(id -u):$(id -g)" \
            -e SAMPLEZ_REQUIRE_PATHS=avx2 -e CARGO_INCREMENTAL=0 \
            -v "$PWD:/w" -v "$PWD/.cargo-registry:/usr/local/cargo/registry" \
            -w /w samplez-builder:ci cargo test --workspace --locked
      # The AMWA specification repositories at the commits pinned in
      # crates/samplez-nmos/tests/specs.txt.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: nmos-specs
          key: nmos-specs-${{ hashFiles('crates/samplez-nmos/tests/specs.txt') }}
      - name: NMOS documents against the AMWA schemas
        run: |
          crates/samplez-nmos/tests/fetch-specs.sh nmos-specs
          docker run --rm --user "$(id -u):$(id -g)" \
            -e CARGO_INCREMENTAL=0 -e SAMPLEZ_NMOS_SPECS=/w/nmos-specs \
            -v "$PWD:/w" -v "$PWD/.cargo-registry:/usr/local/cargo/registry" \
            -w /w samplez-builder:ci cargo test --locked -p samplez-nmos --test schemas
      - name: End-to-end scenarios with SCHED_FIFO and locked memory
        run: |
          docker run --rm --user "$(id -u):$(id -g)" \
            --ulimit rtprio=99 --ulimit memlock=-1 \
            -e SAMPLEZ_REQUIRE_PATHS=avx2 -e SAMPLEZ_REQUIRE_RT=1 -e CARGO_INCREMENTAL=0 \
            -v "$PWD:/w" -v "$PWD/.cargo-registry:/usr/local/cargo/registry" \
            -w /w samplez-builder:ci cargo test --locked --test hop
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        name: Clean the workspace crates out of the cache
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -e CARGO_INCREMENTAL=0 \
            -v "$PWD:/w" -v "$PWD/.cargo-registry:/usr/local/cargo/registry" \
            -w /w samplez-builder:ci cargo clean --locked \
            -p samplez -p samplez-dsp -p samplez-mxl -p samplez-nmos -p samplez-replica -p samplez-service
          du -sh target .cargo-registry
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            target
            .cargo-registry
          key: cargo-debug-${{ hashFiles('Cargo.lock', 'docker/builder/Dockerfile') }}-${{ github.sha }}

  # Kernel clock changes against a real engine: an adjtimex step of the
  # TAI offset, and a leap second the kernel inserts at UTC midnight. Both
  # step the clock, so they run in a VM: a container shares the runner's
  # CLOCK_REALTIME and TAI offset (a time namespace offsets only
  # CLOCK_MONOTONIC and CLOCK_BOOTTIME), so CAP_SYS_TIME in one would step
  # the runner's clock. virtme-ng boots the builder image's Debian kernel
  # under KVM with the builder image as the guest's root file system, so
  # the test binary runs against the libmxl and glibc it was built with.
  vm-clock:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the builder image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: docker/builder
          load: true
          tags: samplez-builder:ci
          cache-from: type=gha,scope=builder
      # The debug job's dependencies; this job saves no cache of its own.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            target
            .cargo-registry
          key: cargo-debug-${{ hashFiles('Cargo.lock', 'docker/builder/Dockerfile') }}-${{ github.sha }}
          restore-keys: |
            cargo-debug-${{ hashFiles('Cargo.lock', 'docker/builder/Dockerfile') }}-
            cargo-debug-
      # Linux v6.12 selftest sources, pinned by .github/vm-selftests.sha256.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: vm/selftests
          key: selftests-${{ hashFiles('.github/vm-selftests.sha256') }}
      - name: Build the clock tests and the kernel's leap-a-day selftest
        run: |
          mkdir -p .cargo-registry vm/selftests/timers vm/timers
          # A cache hit passes the check and downloads nothing. A miss tries
          # git.kernel.org, then the GitHub mirror, failing a dead host in seconds.
          cd vm/selftests
          while read -r sum path; do
            echo "$sum  $path" | sha256sum -c --status 2>/dev/null && continue
            for url in \
              "https://git.kernel.org/pub/scm/linux/kernel/git/torvalds/linux.git/plain/tools/testing/selftests/$path?h=v6.12" \
              "https://raw.githubusercontent.com/torvalds/linux/v6.12/tools/testing/selftests/$path"; do
              curl -fsSL --connect-timeout 5 --max-time 30 --retry 2 --retry-all-errors \
                -o "$path" "$url" || continue
              echo "$sum  $path" | sha256sum -c --status && continue 2
            done
            echo "no source served $path with the pinned sha256" >&2
            exit 1
          done < ../../.github/vm-selftests.sha256
          cd ../..
          cp vm/selftests/timers/leap-a-day.c vm/timers/leap-a-day.c
          cp vm/selftests/kselftest.h vm/kselftest.h
          docker run --rm --user "$(id -u):$(id -g)" -e CARGO_INCREMENTAL=0 \
            -v "$PWD:/w" -v "$PWD/.cargo-registry:/usr/local/cargo/registry" \
            -w /w samplez-builder:ci bash -euo pipefail -c '
              cc -O2 -o vm/leap-a-day vm/timers/leap-a-day.c
              cargo test -p samplez-replica --test vm_clock --locked --no-run \
                --message-format=json > vm/build.json
              bin=$(grep -o "\"executable\":\"[^\"]*/vm_clock-[^\"]*\"" vm/build.json | cut -d\" -f4)
              cp "$bin" vm/vm_clock
            '
      - name: Give the runner user KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Step the clock inside a VM
        run: |
          # The packages come from a fixed Debian snapshot at exact
          # versions, so the guest kernel and vng change only with a diff.
          docker run --rm --device /dev/kvm -v "$PWD/vm:/vm" samplez-builder:ci bash -euo pipefail -c '
            export DEBIAN_FRONTEND=noninteractive
            snapshot=http://snapshot.debian.org/archive
            printf "%s\n" \
              "Types: deb" "URIs: $snapshot/debian/20261027T000000Z" \
              "Suites: trixie trixie-updates" "Components: main" \
              "Signed-By: /usr/share/keyrings/debian-archive-keyring.gpg" \
              "Check-Valid-Until: no" "" \
              "Types: deb" "URIs: $snapshot/debian-security/20261027T000000Z" \
              "Suites: trixie-security" "Components: main" \
              "Signed-By: /usr/share/keyrings/debian-archive-keyring.gpg" \
              "Check-Valid-Until: no" > /etc/apt/sources.list.d/debian.sources
            kernel=6.12.113+deb13-amd64
            apt-get -o Acquire::Retries=5 update -qq
            apt-get -o Acquire::Retries=5 install -y -qq --no-install-recommends \
              virtme-ng=1.35-1 qemu-system-x86=1:10.0.13+ds-0+deb13u1 \
              "linux-image-$kernel=6.12.113-1" busybox-static=1:1.37.0-6+b9 > /dev/null
            vng --run "/boot/vmlinuz-$kernel" --memory 2G --cpus 2 --rwdir /vm --exec \
              "cd /vm && SAMPLEZ_VM_CLOCK=1 SAMPLEZ_LEAP_A_DAY=/vm/leap-a-day ./vm_clock --test-threads=1 --nocapture"
          ' 2>&1 | tee vm.log
          grep -q "test result: ok. 2 passed" vm.log
          grep "deadline misses" vm.log >> "$GITHUB_STEP_SUMMARY"

  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the builder image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: docker/builder
          load: true
          tags: samplez-builder:ci
          cache-from: type=gha,scope=builder
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            target
            .cargo-registry
          key: cargo-release-${{ hashFiles('Cargo.lock', 'docker/builder/Dockerfile') }}-${{ github.sha }}
          restore-keys: |
            cargo-release-${{ hashFiles('Cargo.lock', 'docker/builder/Dockerfile') }}-
            cargo-release-
      - name: Test the release build in the builder image
        run: |
          mkdir -p .cargo-registry
          docker run --rm --user "$(id -u):$(id -g)" \
            -e SAMPLEZ_REQUIRE_PATHS=avx2 -e CARGO_INCREMENTAL=0 \
            -v "$PWD:/w" -v "$PWD/.cargo-registry:/usr/local/cargo/registry" \
            -w /w samplez-builder:ci cargo test --workspace --locked --release
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        name: Clean the workspace crates out of the cache
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -e CARGO_INCREMENTAL=0 \
            -v "$PWD:/w" -v "$PWD/.cargo-registry:/usr/local/cargo/registry" \
            -w /w samplez-builder:ci cargo clean --locked --release \
            -p samplez -p samplez-dsp -p samplez-mxl -p samplez-nmos -p samplez-replica -p samplez-service
          du -sh target .cargo-registry
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            target
            .cargo-registry
          key: cargo-release-${{ hashFiles('Cargo.lock', 'docker/builder/Dockerfile') }}-${{ github.sha }}

  # The end-to-end scenarios over the release build, on a runner of
  # their own. They read the release job's dependency cache and save
  # none.
  e2e-release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the builder image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: docker/builder
          load: true
          tags: samplez-builder:ci
          cache-from: type=gha,scope=builder
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            target
            .cargo-registry
          key: cargo-release-${{ hashFiles('Cargo.lock', 'docker/builder/Dockerfile') }}-${{ github.sha }}
          restore-keys: |
            cargo-release-${{ hashFiles('Cargo.lock', 'docker/builder/Dockerfile') }}-
            cargo-release-
      - name: End-to-end scenarios with SCHED_FIFO and locked memory
        run: |
          mkdir -p .cargo-registry
          docker run --rm --user "$(id -u):$(id -g)" \
            --ulimit rtprio=99 --ulimit memlock=-1 \
            -e SAMPLEZ_REQUIRE_PATHS=avx2 -e SAMPLEZ_REQUIRE_RT=1 -e CARGO_INCREMENTAL=0 \
            -v "$PWD:/w" -v "$PWD/.cargo-registry:/usr/local/cargo/registry" \
            -w /w samplez-builder:ci cargo test --locked --release --test hop

  # RealtimeSanitizer over the RT loop on the builder's pinned nightly,
  # with the lib tests' failure paths and page hashes over a skip and
  # clock steps, and the Callgrind
  # instruction-count limits of the RT benchmarks.
  # Docker's seccomp profile refuses the personality call setarch -R
  # makes, so Valgrind runs with ASLR on; the counts do not move with
  # it (two runs give equal counts).
  rt-gates:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the builder image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: docker/builder
          load: true
          tags: samplez-builder:ci
          cache-from: type=gha,scope=builder
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            target
            .cargo-registry
          key: cargo-rt-${{ hashFiles('Cargo.lock', 'docker/builder/Dockerfile') }}-${{ github.sha }}
          restore-keys: |
            cargo-rt-${{ hashFiles('Cargo.lock', 'docker/builder/Dockerfile') }}-
            cargo-rt-
      - name: RT gates
        run: |
          mkdir -p .cargo-registry
          docker run --rm --user "$(id -u):$(id -g)" \
            -e SAMPLEZ_REQUIRE_PATHS=avx2 -e GUNGRAUN_ALLOW_ASLR=yes -e CARGO_INCREMENTAL=0 \
            -v "$PWD:/w" -v "$PWD/.cargo-registry:/usr/local/cargo/registry" \
            -w /w samplez-builder:ci bash -euo pipefail -c '
              RUSTFLAGS="-Zsanitizer=realtime --cfg samplez_rtsan" \
                cargo "+$SAMPLEZ_NIGHTLY" test --locked -Zbuild-std \
                --target x86_64-unknown-linux-gnu --lib --test rtsan 2>&1 | tee rtsan.log
              # The gate tests ran: without the cfg they compile to nothing.
              for t in rtsan_aborts_an_allocation_in_a_real_time_function \
                the_rt_thread_passes_rtsan the_rt_thread_passes_rtsan_holding_blocks \
                the_rt_thread_passes_rtsan_with_strips \
                a_writer_refuses_in_the_real_time_context \
                a_selected_read_runs_in_the_real_time_context \
                engine::tests::the_failure_paths_run_on_the_rt_thread \
                engine::tests::page_hashes_leave_out_the_pages_a_skip_cut \
                engine::tests::a_handover_the_rt_thread_passed_is_refused; do
                grep -qx "test $t ... ok" rtsan.log || { echo "$t did not pass" >&2; exit 1; }
              done
              cargo bench --locked -p samplez -p samplez-dsp -p samplez-mxl --bench rt
            '
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        name: Clean the workspace crates out of the cache
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -e CARGO_INCREMENTAL=0 \
            -v "$PWD:/w" -v "$PWD/.cargo-registry:/usr/local/cargo/registry" \
            -w /w samplez-builder:ci bash -euo pipefail -c '
              packages="-p samplez -p samplez-dsp -p samplez-mxl -p samplez-nmos -p samplez-replica -p samplez-service"
              cargo clean --locked --release $packages
              cargo "+$SAMPLEZ_NIGHTLY" clean --locked --target x86_64-unknown-linux-gnu $packages
            '
          du -sh target .cargo-registry
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            target
            .cargo-registry
          key: cargo-rt-${{ hashFiles('Cargo.lock', 'docker/builder/Dockerfile') }}-${{ github.sha }}

  # The required check: green only when every job above passed.
  ci:
    if: always()
    needs: [lint, debug, vm-clock, release, e2e-release, rt-gates]
    runs-on: ubuntu-24.04
    steps:
      - name: Every job passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "$RESULTS"
          for r in $RESULTS; do test "$r" = success; done
