name: release-please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  release-please:
    runs-on: ubuntu-24.04
    env:
      HAS_RELEASE_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN != '' }}
    steps:
      - name: Report a missing release token
        if: env.HAS_RELEASE_TOKEN != 'true'
        run: >-
          echo "::warning::RELEASE_PLEASE_TOKEN is not set. Release PRs are
          opened with GITHUB_TOKEN, so CI does not run on them and tags
          created here trigger no tag workflows."
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
