name: builder

on:
  push:
    branches: [main]
    paths: [docker/builder/**, .github/workflows/builder.yml]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/build-push-action@v6
        with:
          context: docker/builder
          push: true
          tags: |
            ghcr.io/danielclasen/samplez-builder:${{ github.sha }}
            ghcr.io/danielclasen/samplez-builder:latest
          cache-from: type=gha,scope=builder
          cache-to: type=gha,scope=builder,mode=max
