name: builder

on:
  push:
    branches: [main]
    paths: [docker/builder/**, .github/workflows/builder.yml]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: builder
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: versions
        name: Read pinned versions from the Dockerfile
        run: |
          mxl=$(sed -n 's/^ARG MXL_SHA=//p' docker/builder/Dockerfile)
          rust=$(sed -n 's/^ARG RUST_VERSION=//p' docker/builder/Dockerfile)
          test -n "$mxl"
          test -n "$rust"
          echo "tag=mxl-${mxl:0:12}-rust-${rust}" >> "$GITHUB_OUTPUT"
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/danielclasen/samplez-builder
          tags: |
            type=sha,format=long,prefix=
            type=raw,value=${{ steps.versions.outputs.tag }},enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: docker/builder
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=builder
          cache-to: type=gha,scope=builder,mode=max
