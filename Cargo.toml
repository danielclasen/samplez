[package]
name = "samplez"
version = "0.0.0"
edition = "2024"
rust-version = "1.96"
license = "Apache-2.0"
repository = "https://github.com/danielclasen/samplez"
description = "Real-time multichannel audio engine with MXL I/O"
publish = false

[workspace]
members = ["crates/samplez-dsp", "crates/samplez-mxl", "crates/samplez-service"]

[dependencies]

libc = "0.2"
mxl-sys = { git = "https://github.com/dmf-mxl/mxl", rev = "8f3f1096e804bfb822eb959cdf2fc23199a7d15d", features = ["mxl-not-built"] }
rtrb = "0.3"
samplez-dsp = { path = "crates/samplez-dsp", version = "0.0.0" }
samplez-mxl = { path = "crates/samplez-mxl", version = "0.0.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[test]]
name = "hop"
harness = false
