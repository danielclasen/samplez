[package]
name = "samplez"
version = "0.19.0"
edition = "2024"
rust-version = "1.96"
license = "Apache-2.0"
repository = "https://github.com/danielclasen/samplez"
description = "Real-time multichannel audio engine with MXL I/O"
publish = false

[workspace]
members = ["crates/samplez-dsp", "crates/samplez-mxl", "crates/samplez-nmos", "crates/samplez-replica", "crates/samplez-service"]

[dependencies]

libc = "0.2"
mxl-sys = { git = "https://github.com/dmf-mxl/mxl", rev = "8f3f1096e804bfb822eb959cdf2fc23199a7d15d", features = ["mxl-not-built"] }
rtrb = "0.3"
samplez-dsp = { path = "crates/samplez-dsp", version = "0.19.0" }
samplez-mxl = { path = "crates/samplez-mxl", version = "0.19.0" }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
xxhash-rust = { version = "=0.8.15", features = ["xxh3"] }

# The end-to-end scenarios need SCHED_FIFO and mlockall to hold their
# timing: `cargo test --workspace` leaves them out, CI runs them with
# `--test hop` in a container with rtprio and memlock limits raised.
[dev-dependencies]
gungraun = "=0.20.0"
samplez-mxl = { path = "crates/samplez-mxl", version = "0.19.0", features = ["test-hooks"] }

# Instruction-count gates under Callgrind; CI runs them with
# `cargo bench --bench rt` in the builder image.
[[bench]]
name = "rt"
harness = false

[[test]]
name = "hop"
harness = false
test = false

# Set by CI: samplez_rtsan by the RealtimeSanitizer gate, marking the RT
# functions for -Zsanitizer=realtime; samplez_lint_probe by the lint
# probe.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(samplez_rtsan)", 'cfg(samplez_lint_probe, values("samplez", "samplez-mxl", "samplez-dsp"))'] }

# clippy.toml's blocking primitives: allowed here, denied in the RT
# modules.
[lints.clippy]
disallowed_methods = "allow"
disallowed_types = "allow"
