[package]
name = "samplez-mxl"
version = "0.5.0"
edition = "2024"
rust-version = "1.96"
license = "Apache-2.0"
repository = "https://github.com/danielclasen/samplez"
description = "MXL flow input and output for the samplez engine"
publish = false

[dependencies]
mxl = { git = "https://github.com/dmf-mxl/mxl", rev = "8f3f1096e804bfb822eb959cdf2fc23199a7d15d", features = ["mxl-not-built"] }
mxl-sys = { git = "https://github.com/dmf-mxl/mxl", rev = "8f3f1096e804bfb822eb959cdf2fc23199a7d15d", features = ["mxl-not-built"] }
serde_json = "1"

[[test]]
name = "process"
harness = false

# Set by CI: samplez_rtsan by the RealtimeSanitizer gate, marking the RT
# functions for -Zsanitizer=realtime; samplez_lint_probe by the lint
# probe.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(samplez_rtsan)", 'cfg(samplez_lint_probe, values("samplez", "samplez-mxl", "samplez-dsp"))'] }

# clippy.toml's blocking primitives: allowed here, denied in the RT
# modules.
[lints.clippy]
disallowed_methods = "allow"
disallowed_types = "allow"

[dev-dependencies]
gungraun = "=0.20.0"

# Instruction-count gates under Callgrind; CI runs them with
# `cargo bench --bench rt` in the builder image.
[[bench]]
name = "rt"
harness = false
