[package]
name = "samplez-nmos"
version = "0.26.1"
edition = "2024"
rust-version = "1.96"
license = "Apache-2.0"
repository = "https://github.com/danielclasen/samplez"
description = "NMOS IS-04 and IS-05 for samplez products, with MXL transport per BCP-007-03"
publish = false

[dependencies]
axum = { version = "=0.8.9", default-features = false, features = ["http1", "tokio"] }
hickory-resolver = "=0.26.3"
libc = "=0.2.191"
mdns-sd = { version = "=0.21.7", default-features = false }
# Plain HTTP to the registry: registries advertising api_proto=https are
# not used.
reqwest = { version = "=0.12.28", default-features = false }
samplez-service = { path = "../samplez-service", version = "0.26.1" }
serde_json = "=1.0.154"
tokio = { version = "=1.54.1", features = ["macros", "rt", "sync", "time"] }
tracing = "=0.1.44"
uuid = { version = "=1.29.2", features = ["serde", "v5"] }

[dev-dependencies]
jsonschema = { version = "=0.60.2", default-features = false }
tokio = { version = "=1.54.1", features = ["macros", "net", "rt", "rt-multi-thread", "signal", "sync", "test-util", "time"] }
tower = { version = "=0.5.3", features = ["util"] }
tracing-subscriber = { version = "=0.3.20", default-features = false, features = ["fmt", "std"] }

# Validates the served documents against the AMWA schemas, which
# tests/fetch-specs.sh checks out first: `cargo test --workspace` leaves
# it out, CI runs it with `--test schemas`.
[[test]]
name = "schemas"
test = false

# clippy.toml's blocking primitives: allowed here, denied in the RT
# modules.
[lints.clippy]
disallowed_methods = "allow"
disallowed_types = "allow"
# Pedantic lints the code is held to: each fix is mechanical and changes
# no behaviour, so a new warning means a slip, not a judgement call.
cast_lossless = "warn"
doc_markdown = "warn"
duration_suboptimal_units = "warn"
ignored_unit_patterns = "warn"
manual_let_else = "warn"
redundant_closure_for_method_calls = "warn"
return_self_not_must_use = "warn"
semicolon_if_nothing_returned = "warn"
unreadable_literal = "warn"
