[package]
name = "samplez-replica"
version = "0.12.3"
edition = "2024"
rust-version = "1.96"
license = "Apache-2.0"
repository = "https://github.com/danielclasen/samplez"
description = "Replicated log, state machine and command dedup for samplez products"
publish = false

[dependencies]
axum = { version = "=0.8.9", features = ["ws"] }
base64 = "=0.22.1"
futures-util = { version = "=0.3.34", default-features = false, features = ["alloc"] }
http-body-util = "=0.1.5"
hyper = { version = "=1.12.0", features = ["client", "http1"] }
hyper-util = { version = "=0.1.21", features = ["tokio"] }
libc = "=0.2.191"
openraft = "=0.9.26"
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
samplez = { path = "../..", version = "0.12.3" }
samplez-dsp = { path = "../samplez-dsp", version = "0.12.3" }
samplez-mxl = { path = "../samplez-mxl", version = "0.12.3" }
samplez-service = { path = "../samplez-service", version = "0.12.3" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.154", features = ["float_roundtrip"] }
tokio = { version = "=1.54.1", features = ["macros", "net", "rt", "sync", "time"] }
tokio-rustls = { version = "=0.26.6", default-features = false }
tracing = "=0.1.44"
xxhash-rust = { version = "=0.8.15", features = ["xxh3"] }

[dev-dependencies]
futures-util = { version = "=0.3.34", default-features = false, features = ["alloc", "sink"] }
rcgen = { version = "=0.14.10", default-features = false, features = ["pem", "crypto", "ring"] }
rtrb = "=0.3.6"
tokio = { version = "=1.54.1", features = ["macros", "net", "rt", "sync", "test-util", "time"] }

# clippy.toml's blocking primitives: allowed here, denied in the RT
# modules.
[lints.clippy]
disallowed_methods = "allow"
disallowed_types = "allow"
