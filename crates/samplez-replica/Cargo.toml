[package]
name = "samplez-replica"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
license = "Apache-2.0"
repository = "https://github.com/danielclasen/samplez"
description = "Replicated log, state machine and command dedup for samplez products"
publish = false

[dependencies]
axum = { version = "=0.8.9", features = ["ws"] }
futures-util = { version = "=0.3.34", default-features = false, features = ["alloc"] }
openraft = "=0.9.21"
samplez-service = { path = "../samplez-service", version = "0.1.0" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
tokio = { version = "=1.54.1", features = ["macros", "rt", "sync", "time"] }
xxhash-rust = { version = "=0.8.15", features = ["xxh3"] }

[dev-dependencies]
tokio = { version = "=1.54.1", features = ["macros", "rt", "sync", "test-util", "time"] }
