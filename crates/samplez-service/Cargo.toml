[package]
name = "samplez-service"
version = "0.0.0"
edition = "2024"
rust-version = "1.96"
license = "Apache-2.0"
repository = "https://github.com/danielclasen/samplez"
description = "Listeners, auth, ops endpoints and WebSocket fan-out shared by samplez products"
publish = false

[dependencies]
axum = { version = "=0.8.9", features = ["ws"] }
futures-util = { version = "=0.3.34", default-features = false, features = ["sink"] }
hmac = "=0.13.0"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sha2 = "=0.11.1"
subtle = "=2.6.1"
tokio = { version = "=1.54.1", features = ["macros", "net", "rt", "sync", "time"] }
utoipa = "=6.0.0"

[dev-dependencies]
tokio = { version = "=1.54.1", features = ["macros", "net", "rt", "sync", "test-util", "time"] }
tokio-tungstenite = "=0.30.0"
tower = { version = "=0.5.3", features = ["util"] }
