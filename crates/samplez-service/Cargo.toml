[package]
name = "samplez-service"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
license = "Apache-2.0"
repository = "https://github.com/danielclasen/samplez"
description = "Listeners, auth, ops endpoints and WebSocket fan-out shared by samplez products"
publish = false

[dependencies]
axum = { version = "=0.8.9", features = ["ws"] }
futures-util = { version = "=0.3.34", default-features = false, features = ["alloc", "sink"] }
hmac = "=0.13.0"
rcgen = { version = "=0.14.10", default-features = false, features = ["pem", "crypto", "ring"] }
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sha2 = "=0.11.1"
subtle = "=2.6.1"
tokio = { version = "=1.54.1", features = ["macros", "net", "rt", "sync", "time"] }
tokio-rustls = { version = "=0.26.6", default-features = false }
tracing = "=0.1.44"
utoipa = "=6.0.0"

[dev-dependencies]
tokio = { version = "=1.54.1", features = ["io-util", "macros", "net", "rt", "sync", "test-util", "time"] }
tokio-tungstenite = "=0.29.0"
tower = { version = "=0.5.3", features = ["util"] }
