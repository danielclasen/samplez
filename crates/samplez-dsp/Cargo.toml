[package]
name = "samplez-dsp"
version = "0.23.1"
edition = "2024"
rust-version = "1.96"
license = "Apache-2.0"
repository = "https://github.com/danielclasen/samplez"
description = "Gain ramps, mixing matrix, meters and loudness for samplez"
publish = false

[dependencies]
libm = "=0.2.16"
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
gungraun = "=0.20.0"
serde_json = "1"

# Instruction-count gates under Callgrind; CI runs them with
# `cargo bench --bench rt` in the builder image.
[[bench]]
name = "rt"
harness = false

# Set by CI: samplez_lint_probe by the lint probe.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(samplez_lint_probe, values("samplez", "samplez-mxl", "samplez-dsp"))'] }

# clippy.toml's blocking primitives: allowed here, denied in the RT
# modules.
[lints.clippy]
disallowed_methods = "allow"
disallowed_types = "allow"
