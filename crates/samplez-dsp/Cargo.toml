[package]
name = "samplez-dsp"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
license = "Apache-2.0"
repository = "https://github.com/danielclasen/samplez"
description = "Gain ramps, mixing matrix, meters and loudness for samplez"
publish = false

[dependencies]
libm = "0.2.16"

[dev-dependencies]
gungraun = "=0.20.0"

# Instruction-count gates under Callgrind; CI runs them with
# `cargo bench --bench rt` in the builder image.
[[bench]]
name = "rt"
harness = false
